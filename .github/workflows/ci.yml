name: Assessment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_DEPLOYMENT: local
  ATLAS_LIVE_ENABLED: "0"
  ATLAS_PUBLIC_WEATHER_CONFIRMED: "0"
  ATLAS_PUBLIC_TOMTOM_CONFIRMED: "0"
  TOMTOM_API_KEY: ""

jobs:
  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci
          POSTGRES_DB: atlas_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://atlas_ci:atlas_ci@127.0.0.1:5432/atlas_ci?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: pip install -e . --no-deps --no-build-isolation
      - run: ruff check . && ruff format --check .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file /tmp/atlas-openapi.yaml --validate --fail-on-warn
      - run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm run format:check
      - run: npm run check:contracts
      - run: npm test && npm run build

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
      - name: Install locked dependencies
        run: |
          pip install -r backend/requirements.lock.txt
          cd frontend
          npm ci --ignore-scripts
          npm run build
      - name: Run sample-only browser suite
        env:
          ATLAS_FRONTEND_URL: http://127.0.0.1:4173
          ATLAS_BACKEND_URL: http://127.0.0.1:8000
          ATLAS_BROWSER_EVIDENCE_SUBDIR: ci-browser
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py runserver 127.0.0.1:8000 --noreload >/tmp/atlas-backend.log 2>&1 &
          cd frontend
          npm run preview >/tmp/atlas-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node e2e/local-browser.cjs
