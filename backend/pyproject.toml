[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spotter-atlas-local-foundation"
version = "0.1.0"
description = "Django assessment API for Spotter Atlas"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.30",
  "django-cors-headers>=4.8,<5",
  "geographiclib>=2.1,<3",
  "psycopg[binary]==3.3.6",
  "gunicorn==26.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["atlas*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Public domain re-exports are intentional; the module declares its public API.
"atlas/domain/__init__.py" = ["F401"]
